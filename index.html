<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 指で広げても拡大しないようにする（遊び方は拡大しなくても見える絵で伝えているため） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ライツアウト</title>
  <style>
    /* ページの一番外側でも、引っぱったときの伸びを止める */
    html {
      overscroll-behavior: none;
    }

    /* ページ全体：背景を暗くして、中身を真ん中に置く */
    body {
      margin: 0;
      padding: 16px; /* スマホで画面のふちにくっつかないように */
      box-sizing: border-box;
      min-height: 100vh;  /* dvh が使えない古いブラウザ用 */
      min-height: 100dvh; /* スマホのアドレスバーが出ているときも、本当の画面の高さに合わせる */
      overscroll-behavior: none; /* 画面の端で引っぱったときに、ページ全体が伸びて動かないようにする */
      background: #1e1e2e;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* タイトル：文字と遊び方の絵が入った画像。ふつうは幅360px。画面がせまいときは、はみ出さないように縮める */
    h1 {
      width: min(360px, 100%);
      margin: 0 0 4px;
    }

    /* タイトル画像：h1 の幅いっぱいに広げる（高さは縦横の比率を保って自動で決まる） */
    h1 img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* マス目：5列に並べる */
    #board {
      /* マスの大きさ：ふつうは60px。画面がせまいときは、はみ出さない大きさまで小さくする */
      --cell: min(60px, calc((100vw - 32px - 32px) / 5));
      display: grid;
      grid-template-columns: repeat(5, var(--cell));
      gap: 8px;
    }

    /* 1つ1つのマス */
    .cell {
      width: var(--cell);
      height: var(--cell);
      border: none;
      border-radius: 8px;
      background: #3a3a4f; /* 消えている色 */
      cursor: pointer;
      transition: background 0.2s, transform 0.1s; /* 色と大きさをなめらかに変える */
      touch-action: manipulation; /* スマホで素早く2回押しても、画面が拡大されないようにする */
    }

    /* 押している間だけ、少し縮む */
    .cell:active {
      transform: scale(0.9);
    }

    /* 光っているマス */
    .cell.on {
      background: #ffd166;
    }

    /* 「CLEAR!」の文字 */
    #message {
      height: 1.5em;
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #ffd166;
    }

    /* 「新しい問題」ボタン */
    #new-game {
      display: flex;          /* アイコンをボタンの真ん中に置く */
      align-items: center;
      justify-content: center;
      padding: 8px 24px;
      border: none;
      border-radius: 8px;
      background: #ffd166;
      color: #1e1e2e;         /* アイコンの色（SVGの currentColor がこの色になる） */
      cursor: pointer; /* マウスを乗せると指の形になる */
      box-shadow: 0 4px 0 #d9a441; /* 下に影（ボタンの側面）をつけて、浮いているように見せる */
      touch-action: manipulation;  /* スマホで素早く2回押しても、画面が拡大されないようにする */
      transition: transform 0.1s, box-shadow 0.1s;
    }

    /* 押している間：ボタンが下に沈む（影が消えて、そのぶん下がる） */
    #new-game:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #d9a441;
    }

    /* 裏返っている最中のマス */
    .cell.flipping {
      animation: flip 0.4s ease-in-out;
      transition: none; /* 裏返りの途中で色がパッと変わるように、なめらかな色の変化を止める */
    }

    /* 裏返る動き：真横を向く（見えなくなる）→ 元に戻る */
    @keyframes flip {
      0%   { transform: rotateY(0deg); }
      50%  { transform: rotateY(90deg); }
      100% { transform: rotateY(0deg); }
    }
  </style>
</head>
<body>
  <!-- タイトルと遊び方の画像。alt は画像が見えない人や読み上げソフトに伝える説明 -->
  <h1><img src="images/title.png" alt="LIGHTS OUT：光っているマスを押して、全部消すとクリア" width="585" height="224"></h1>

  <!-- 押した回数 -->
  <p id="moves">STEP 0</p>

  <!-- ここにマス目が入る -->
  <div id="board"></div>

  <!-- クリアしたらここに文字が出る -->
  <p id="message"></p>

  <!-- 押すと新しい問題になる -->
  <!-- 見た目は矢印のアイコンだけ。aria-label は読み上げソフトに「新しい問題」と伝える説明 -->
  <button id="new-game" aria-label="新しい問題" title="新しい問題">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
      <!-- 右から下・左・上へ、ぐるっと回る太い線 -->
      <path d="M19 13 A7 7 0 1 1 12 6" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <!-- 線の先に付ける、右向きの三角（矢じり） -->
      <path d="M11 1.5 L17.5 6 L11 10.5 Z" fill="currentColor"/>
    </svg>
  </button>

  <script>
    const SIZE = 5; // 5×5
    const board = document.getElementById("board");
    const cells = []; // 作ったマスをここに順番に入れておく
    let moves = 0;    // 押した回数（手数）

    // マスを押したときの効果音
    const pressSound = new Audio("sounds/press.mp3");
    function playPressSound() {
      pressSound.currentTime = 0; // 続けて押したときも、最初から鳴らし直す
      pressSound.play();
    }

    // クリアしたときの効果音：プログラムで「ド・ミ・ソ・ド」と上がっていく音を作る
    let audioContext = null; // 音を作る道具（最初に鳴らすときに用意する）
    function playClearSound() {
      if (!audioContext) audioContext = new AudioContext();
      const notes = [523, 659, 784, 1047]; // ド・ミ・ソ・高いド の音の高さ（Hz）
      notes.forEach((freq, n) => {
        const start = audioContext.currentTime + n * 0.12; // 0.12秒ずつずらして鳴らす
        const osc = audioContext.createOscillator(); // 音のもと
        const gain = audioContext.createGain();      // 音の大きさ
        osc.type = "triangle"; // やわらかい電子音
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4); // だんだん小さくして消す
        osc.connect(gain).connect(audioContext.destination);
        osc.start(start);
        osc.stop(start + 0.4);
      });
    }

    // 25個のマスを作って、マス目に入れる
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement("button");
      cell.className = "cell";
      // 押されたら、色を変えて、手数を1増やしてから、クリアしたか調べる
      cell.addEventListener("click", () => {
        playPressSound();
        press(i);
        moves++;
        document.getElementById("moves").textContent = "STEP " + moves;
        checkClear();
      });
      board.appendChild(cell);
      cells.push(cell);
    }

    // 何行目・何列目のマスの色を反対にする（光る⇔消える）
    function toggle(row, col) {
      // マス目の外なら何もしない
      if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
      cells[row * SIZE + col].classList.toggle("on");
    }

    // i番目のマスが押されたとき：そのマスと上下左右の色を変える
    function press(i) {
      const row = Math.floor(i / SIZE); // 何行目か
      const col = i % SIZE;             // 何列目か
      toggle(row, col);     // 押したマス
      toggle(row - 1, col); // 上
      toggle(row + 1, col); // 下
      toggle(row, col - 1); // 左
      toggle(row, col + 1); // 右
    }

    // 全部のマスが消えていたら「CLEAR! STEP ○」と出す
    function checkClear() {
      const allOff = cells.every(cell => !cell.classList.contains("on"));
      document.getElementById("message").textContent = allOff ? "CLEAR! STEP " + moves : "";
      if (allOff) playClearSound();
    }

    // 最初の並びをランダムに作る
    // 全部消えた状態から、ランダムなマスを10回「押して」作るので、必ず解ける問題になる
    function newGame() {
      do {
        cells.forEach(cell => cell.classList.remove("on")); // いったん全部消す
        for (let n = 0; n < 10; n++) {
          press(Math.floor(Math.random() * SIZE * SIZE)); // 0〜24のどれかを押す
        }
      } while (cells.every(cell => !cell.classList.contains("on"))); // 偶然全部消えていたら作り直す

      moves = 0;
      document.getElementById("moves").textContent = "STEP 0";
      document.getElementById("message").textContent = "";
    }

    // ボタンが押されたら、マスを裏返しながら新しい問題を作る
    const newGameButton = document.getElementById("new-game");
    newGameButton.addEventListener("click", () => {
      newGameButton.disabled = true; // 裏返っている間は、もう一度押せないようにする
      cells.forEach(cell => cell.classList.add("flipping"));

      // 0.2秒後（マスが真横を向いて見えないとき）に、新しい並びに入れ替える
      setTimeout(newGame, 200);

      // 0.4秒後（裏返り終わったとき）に、元に戻す
      setTimeout(() => {
        cells.forEach(cell => cell.classList.remove("flipping"));
        newGameButton.disabled = false;
      }, 400);
    });

    newGame();
  </script>
</body>
</html>
